Tooltip:
  origin_sub_path: "Location of timed subtitle (or folder for season mode)."
  ocr_sub_path: "Location of ocr subtitle (or folder for season mode)."
  output_filename: "Output file. Empty = <timed sub name>.synced.ass next to timed sub. Season mode: output folder (empty = next to timed subs)."
  same_rate: "Ratio of same time between 2 lines. Default: 0.5"
  time_tolerance: "2 lines are same time / continuous if start and end differ less than this (ms). Default: 125 (~3 frames at 23.976 fps)"
  custom_shift: "Shift ocr subtitle before matching, in ms (negative = earlier). Default: 0"
  max_line_length: "Ocr lines longer than this (without line break) are wrapped into 2 rows. Default: 62"
  comment_timed_sub: "Comment lines that only appear in timed subtitle. Lines that only appear in ocr subtitle are always commented. Default: True"
  keep_timed_text: "Keep text of timed sub as {comment} before the new text. Default: True"
  strip_ocr_tags: "Remove all {\\tags} (italic, \\an8...) from dialogue of ocr sub, only plain text is kept. Signs are not affected. Default: False"
  is_use_sign_timed: "Add sign from timed_sub"
  is_cmt_sign_timed: "Comment sign from timed_sub"
  is_use_sign_ocr: "Add sign from ocr_sub, always commented"
  distance_string_rate: "2 continuous ocr lines are the same line (shown twice) unless they differ by >= distance_string_character characters AND similarity <= this. Default: 0.8"
  distance_string_character: "See distance_string_rate. Default: 2"
  soft_combine_rate: "Extend an ocr line over 2 continuous timed lines if it covers both nearly equally (0-1). Default: 0.8"
  ass_sign_tags: "A line containing any of these tags (\\tag( ) is a sign, joined by __. Default: pos__move__org__clip__t"
  characters: "All letters of your language besides A-Z a-z 0-9 and punctuation. Used to warn and remove garbage ocr lines."
